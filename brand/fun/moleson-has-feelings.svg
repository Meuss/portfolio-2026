<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="960" height="720" role="img" aria-label="The Moléson M, but the peaks have faces and opinions">
  <title>The Moléson M has feelings</title>
  <rect width="480" height="360" fill="#ffffff"/>

  <!-- cable car wire, from the valley to the tall peak -->
  <path d="M24 300 Q170 260 292 112" fill="none" stroke="#16191d" stroke-width="1.5"/>
  <g transform="translate(96 285)">
    <line x1="0" y1="-12" x2="0" y2="0" stroke="#16191d" stroke-width="1.5"/>
    <rect x="-11" y="0" width="22" height="15" rx="3" fill="#d8232a"/>
    <rect x="-7" y="3" width="6" height="5" rx="1" fill="#ffffff"/>
    <rect x="1" y="3" width="6" height="5" rx="1" fill="#ffffff"/>
  </g>

  <g transform="translate(80 40) scale(5)">
    <!-- the M itself, untouched -->
    <path d="M7 51 L21 22 L32 39 L44 13 L57 51" fill="none" stroke="#d8232a" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- small peak: insecure -->
    <circle cx="18.6" cy="34" r="2.3" fill="#fff" stroke="#16191d" stroke-width="0.4"/>
    <circle cx="23.6" cy="34" r="2.3" fill="#fff" stroke="#16191d" stroke-width="0.4"/>
    <circle cx="19.6" cy="33" r="1" fill="#16191d"/>
    <circle cx="24.6" cy="33" r="1" fill="#16191d"/>
    <path d="M16.6 30.6 L20 31.6 M26 30.6 L22.6 31.6" stroke="#16191d" stroke-width="0.45" stroke-linecap="round"/>
    <path d="M19.4 40.2 Q21.1 38.6 22.8 40.2" fill="none" stroke="#16191d" stroke-width="0.5" stroke-linecap="round"/>

    <!-- tall peak: smug -->
    <circle cx="41.4" cy="27" r="2.3" fill="#fff" stroke="#16191d" stroke-width="0.4"/>
    <circle cx="46.6" cy="27" r="2.3" fill="#fff" stroke="#16191d" stroke-width="0.4"/>
    <path d="M39.3 26.6 H43.5 V25 A2.2 2.2 0 0 0 39.3 25 Z" fill="#16191d"/>
    <path d="M44.5 26.6 H48.7 V25 A2.2 2.2 0 0 0 44.5 25 Z" fill="#16191d"/>
    <path d="M41 32.2 Q44.5 35.4 48 31.6" fill="none" stroke="#16191d" stroke-width="0.5" stroke-linecap="round"/>

    <!-- cow, claiming the summit -->
    <g transform="translate(44 4.6)">
      <rect x="-4" y="0" width="7" height="3.6" rx="1.4" fill="#fff" stroke="#16191d" stroke-width="0.35"/>
      <circle cx="-1.8" cy="1.4" r="0.9" fill="#16191d"/>
      <circle cx="1.4" cy="2.4" r="0.7" fill="#16191d"/>
      <rect x="2.4" y="-1.4" width="2.6" height="2.4" rx="0.8" fill="#fff" stroke="#16191d" stroke-width="0.35"/>
      <path d="M2.8 -1.4 L2.3 -2.4 M4.6 -1.4 L5.1 -2.4" stroke="#16191d" stroke-width="0.35" stroke-linecap="round"/>
      <circle cx="3.4" cy="-0.5" r="0.25" fill="#16191d"/>
      <circle cx="4.5" cy="-0.5" r="0.25" fill="#16191d"/>
      <path d="M-3 3.6 V5.2 M-1.6 3.6 V5.2 M0.8 3.6 V5.2 M2.2 3.6 V5.2" stroke="#16191d" stroke-width="0.4" stroke-linecap="round"/>
      <path d="M-4 0.8 Q-5.2 0.4 -5 -0.8" fill="none" stroke="#16191d" stroke-width="0.35" stroke-linecap="round"/>
      <circle cx="0" cy="4.4" r="0.6" fill="#e9b53c" stroke="#16191d" stroke-width="0.2"/>
    </g>
  </g>

  <!-- speech bubbles -->
  <g font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="#16191d" letter-spacing="0.5">
    <path d="M12 52 h150 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-42 l10 40 l-24 -40 h-86 a8 8 0 0 1 -8 -8 v-26 a8 8 0 0 1 8 -8 z" fill="#fff" stroke="#16191d" stroke-width="1.5"/>
    <text x="22" y="70">WHY IS HE ALWAYS</text>
    <text x="22" y="85">THE TALL ONE?</text>

    <path d="M332 196 h132 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-124 a8 8 0 0 1 -8 -8 v-6 l-18 -8 l18 -4 v-8 a8 8 0 0 1 8 -8 z" fill="#fff" stroke="#16191d" stroke-width="1.5"/>
    <text x="342" y="214">PERSPECTIVE,</text>
    <text x="342" y="229">BABY. (BULLE)</text>

    <text x="326" y="50" font-size="9">MOO.</text>
  </g>

  <text x="240" y="346" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="10" letter-spacing="1.2" fill="#5d636b">THOMAS MILLER · BRAND KIT · UNOFFICIAL EDITION</text>
</svg>
