[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  # Netlify detects pnpm from pnpm-lock.yaml + the "packageManager" field in package.json.

# The root picks a language in the edge function
# netlify/edge-functions/root-language.ts (English preferred → /en/, everyone
# else → /fr/), which answers `/` before these rules. This plain redirect is
# only the fallback when the function is skipped or errors (`onError: bypass`).
# No `Language` condition: Netlify's CDN caches that 302 and answers at random.
# `force` because dist/index.html (the dev/preview fallback) exists at `/`.
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true

# Unknown URLs get the localized 404 (non-forced rules only apply when no file matches).
[[redirects]]
  from = "/fr/*"
  to = "/fr/404/"
  status = 404

[[redirects]]
  from = "/*"
  to = "/en/404/"
  status = 404

# Everything in /_astro/ has a content hash in its name (scripts, styles, fonts,
# images): a new build writes new names, so browsers may keep these for a year
# without asking again. Netlify's default (max-age=0, must-revalidate) re-checks
# each one on every visit. HTML keeps the default, so a deploy shows at once.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
