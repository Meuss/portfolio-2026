[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  # Netlify detects pnpm from pnpm-lock.yaml + the "packageManager" field in package.json.

# The Netlify address must not serve a copy of the site: send it to the domain.
# Deploy previews use other hostnames and are not affected.
[[redirects]]
  from = "https://thomasmiller2026.netlify.app/*"
  to = "https://thomasmiller.ch/:splat"
  status = 301
  force = true

# The root picks a language in the edge function
# netlify/edge-functions/root-language.ts (English preferred → /en/, everyone
# else → /fr/), which answers `/` before these rules. This plain redirect is
# only the fallback when the function is skipped or errors (`onError: bypass`).
# No `Language` condition: Netlify's CDN caches that 302 and answers at random.
# `force` because dist/index.html (the dev/preview fallback) exists at `/`.
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true

# Unknown URLs get the localized 404 (non-forced rules only apply when no file matches).
[[redirects]]
  from = "/fr/*"
  to = "/fr/404/"
  status = 404

[[redirects]]
  from = "/*"
  to = "/en/404/"
  status = 404

# Everything in /_astro/ has a content hash in its name (scripts, styles, fonts,
# images): a new build writes new names, so browsers may keep these for a year
# without asking again. Netlify's default (max-age=0, must-revalidate) re-checks
# each one on every visit. HTML keeps the default, so a deploy shows at once.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every response. The pages need inline scripts and styles
# (the `js` class, the nav, the form, Astro's scoped styles), so the CSP allows
# them; GoatCounter is the only outside script and the only outside connection.
# HSTS is already sent by Netlify. Custom headers do not apply to the edge
# function's redirect at `/`.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://thomasmiller.goatcounter.com; font-src 'self'; connect-src 'self' https://thomasmiller.goatcounter.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
