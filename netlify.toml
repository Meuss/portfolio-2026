[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  # Netlify detects pnpm from pnpm-lock.yaml + the "packageManager" field in package.json.

[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

# Unknown URLs get the localized 404 (non-forced rules only apply when no file matches).
[[redirects]]
  from = "/fr/*"
  to = "/fr/404/"
  status = 404

[[redirects]]
  from = "/*"
  to = "/en/404/"
  status = 404
