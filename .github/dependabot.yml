version: 2
updates:
  # pnpm lockfiles are handled by the `npm` ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    ignore:
      # `astro check` does not support TypeScript 7 yet; remove once Astro does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns: ['*']
